name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feature/app-builder-p1-vite-migration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-builder-p1/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install App Builder dependencies
        working-directory: app-builder-p1
        run: npm ci

      - name: Build App Builder
        working-directory: app-builder-p1
        run: npm run build

      - name: Assemble the complete Pages site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '/.gitignore' \
            --exclude '_site/' \
            --exclude 'app-builder-p1/' \
            ./ _site/
          mkdir -p _site/app-builder-p1
          cp -R app-builder-p1/dist/. _site/app-builder-p1/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

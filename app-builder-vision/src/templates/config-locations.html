    <!-- ---------- LOCATIONS config ---------- -->
    <div class="cp-page" id="cp-locations" style="display:none;">
      <div class="cp-master">
        <h3 class="cp-head">Editing page</h3>
        <div class="cp-page-title">Locations</div>
        <div class="cp-page-sub">Branch details come from Hub 2 Business Info. Choose what members see here.</div>

        <div class="cp-section open">
          <div class="cp-head-row">What to show <span class="chev">›</span></div>
          <div class="cp-body">
            <div class="cp-toggle-row">
              <span class="lbl">Search branches</span>
              <span class="toggle on" data-bind=".app-page[data-page='locations'] .search-bar"></span>
            </div>
            <div class="cp-toggle-row">
              <span class="lbl">Filter chips</span>
              <span class="toggle on" data-bind=".app-page[data-page='locations'] .filter-chips"></span>
            </div>
            <div class="cp-toggle-row">
              <span class="lbl">Opening hours &amp; distance</span>
              <span class="toggle on" data-bind=".app-page[data-page='locations'] .loc-card .meta"></span>
            </div>
            <div class="cp-toggle-row">
              <span class="lbl">Navigate button</span>
              <span class="toggle on" data-bind=".app-page[data-page='locations'] .loc-card .nav-btn"></span>
            </div>
            <div class="cp-section-note">Branches are always sorted by distance from the member. Addresses and hours are edited in Hub 2.</div>
          </div>
        </div>
      </div>
    </div>

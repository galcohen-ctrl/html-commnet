        <div class="phone-modal inbox-modal" data-modal="inbox" aria-hidden="true">
          <section class="inbox-sheet" role="dialog" aria-modal="true" aria-labelledby="inbox-title">
            <div class="inbox-grip" aria-hidden="true"></div>

              <button class="inbox-icon-button" type="button" data-inbox-back aria-label="Back to inbox" title="Back to inbox" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>

            </header>
            <div class="inbox-list-view" data-inbox-list-view>
              <div class="inbox-tools">
                <div class="inbox-tabs" role="tablist" aria-label="Messages"><button type="button" role="tab" data-inbox-filter="all" aria-selected="true" aria-controls="inbox-messages"><span>All</span></button><button type="button" role="tab" data-inbox-filter="unread" aria-selected="false" aria-controls="inbox-messages"><span>Unread</span></button></div>
                <button class="inbox-icon-button inbox-read-all" type="button" data-inbox-read-all aria-label="Mark all as read" title="Mark all as read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m18 6-7 7-3-3m14 0-7 7-3-3M2 12l5 5"/></svg></button>
              </div>
              <div class="inbox-scroll" data-inbox-scroll id="inbox-messages" role="tabpanel" aria-label="Messages">

              </div>
            </div>
            <article class="inbox-detail" data-inbox-detail hidden></article>
            <div class="inbox-live-status" data-inbox-status role="status" aria-live="polite"></div>
          </section>

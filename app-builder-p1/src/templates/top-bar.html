<div class="topbar">
  <div class="brand">
    <div class="brand-logo" id="brand-logo">?</div>
    <div>
      <div class="brand-name" id="brand-name">Your Business</div>
      <div class="brand-sub">Como App Builder · P1</div>
    </div>
  </div>

  <div class="top-spacer"></div>

  <button class="demo-toggle" id="demo-published-toggle" type="button" title="Demo only: simulate the app being live in app stores">Simulate: Published</button>

  <div class="preset-dropdown" id="preset-dropdown">

      <svg class="chev-ic" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="preset-menu" id="preset-menu">
      <button class="preset-menu-item active" data-goal="blank" type="button">Blank canvas</button>
      <button class="preset-menu-item" data-goal="loyalty" type="button">Loyalty &amp; Rewards</button>
      <button class="preset-menu-item" data-goal="ordering" type="button">Online Ordering</button>
    </div>
  </div>

  <button class="save-btn disabled" id="save-btn">Save changes</button>
  <button class="close-btn" title="Close editor">✕</button>
